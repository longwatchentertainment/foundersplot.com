<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password &mdash; Founder's Plot</title>
<link rel="icon" href="/assets/img/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Caslon+Display&display=swap');
  body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f6efdd; color: #203328; text-align: center; padding: 60px 24px; }
  h1 { font-family: 'Libre Caslon Display', Georgia, serif; color: #102d20; }
  a.button { display: inline-block; margin-top: 24px; background: #102d20; color: #f6efdd; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; border: 1px solid #e5b74e; }
  a.button:hover { background: #16412e; }
  p { max-width: 420px; margin: 16px auto; line-height: 1.5; color: #4a5a4e; }
</style>
</head>
<body>
  <h1>Founder's Plot</h1>
  <p>If you have the app installed, this link should have opened it directly.</p>
  <p id="fallback-text">If nothing happened, tap the button below to open the app.</p>
  <a class="button" id="open-app" href="#">Open Founder's Plot</a>
  <script>
    // Fallback for cases where the Universal Link didn't hand off to the app
    // automatically (e.g. Android without assetlinks.json configured yet, or
    // before Apple's AASA verification has propagated) — reconstructs the
    // same custom-scheme deep link App.tsx already knows how to parse, using
    // whatever recovery tokens are in this page's own URL fragment.
    var hash = window.location.hash || '';
    document.getElementById('open-app').href = 'foundersplot://reset-password' + hash;
  </script>
</body>
</html>
