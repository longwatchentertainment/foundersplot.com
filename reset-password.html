<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password &mdash; Founder's Plot</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f1e8; color: #2e2a20; text-align: center; padding: 60px 24px; }
  h1 { color: #2e7d32; }
  a.button { display: inline-block; margin-top: 24px; background: #2e7d32; color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; }
  p { max-width: 420px; margin: 16px auto; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Founder's Plot</h1>
  <p>If you have the app installed, this link should have opened it directly.</p>
  <p id="fallback-text">If nothing happened, tap the button below to open the app.</p>
  <a class="button" id="open-app" href="#">Open Founder's Plot</a>
  <script>
    // Fallback for cases where the Universal Link didn't hand off to the app
    // automatically (e.g. Android without assetlinks.json configured yet, or
    // before Apple's AASA verification has propagated) — reconstructs the
    // same custom-scheme deep link App.tsx already knows how to parse, using
    // whatever recovery tokens are in this page's own URL fragment.
    var hash = window.location.hash || '';
    document.getElementById('open-app').href = 'foundersplot://reset-password' + hash;
  </script>
</body>
</html>
